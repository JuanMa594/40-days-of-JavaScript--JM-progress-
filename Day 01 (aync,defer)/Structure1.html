<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <!-- <script src="./Practica1.js"></script>--> <!-- Esta es una forma de usar un script externo, pero sigue sin ser lo ideal para usar-->
    <script async src="./Practica1.js"></script> <!-- Esta es UNA forma recomendada de usar un script externo, ya que permite que el HTML se cargue sin bloquearse mientras se descarga el script. Aunque gasta un poco de tiempo al cargar la web. Si es un scrpt externo este es el recomendable -->
    <script defer src="./Practica1.js"></script> <!-- Esta es otra forma recomendada de usar un script externo, ya que asegura que el script se ejecute solo después de que el HTML haya sido completamente parseado. Este ahorra tiempo de ejecución -->
</head>
<body>
    <h1>Welcome to my Home Page</h1>
    <!-- <script> Esta es una forma de importar un script directamente en el HTML, pero es mejor usar la etiqueta <script src="..."></script> para mantener el código separado y organizado.
        console.log("Hello, World!");
    </script> -->
    <div id="SomeId">

    </div>
</body>
</html>
